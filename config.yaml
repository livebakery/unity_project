# --- Stocks to monitor (start with one, add tickers freely) ---
watchlist:
  - DOHOME

# --- Buy-signal threshold ---
# ratio = | Up/Down 3Y [Premium] | / | Up/Down [Core] |
# Computed live with current market price (yfinance) and the sheet's
# Fair Price [Premium], 3Y CAGR [Premium], Fair Price [Core].
ratio_threshold: 10.0

# Multi-tier early-warning thresholds. Each entry is "% below ratio_threshold":
#   15 → ratio ≥ 10 * (1 - 0.15) = 8.5  (🟡 watch — เริ่มน่าสน)
#   10 → ratio ≥ 10 * (1 - 0.10) = 9.0  (🟠 warm — ใกล้แล้ว)
# The full ratio_threshold itself (= 10.0) is always the top tier (🔴 buy).
# Each tier dedups independently — a ticker fires one message per upward
# tier crossing; the next tier fires only when ratio climbs higher.
ratio_tier_warnings_pct:
  - 15
  - 10

# --- Market hours (ICT, UTC+7). Outside these times main.py exits early. ---
market_hours_ict:
  morning:
    start: "09:55"
    end: "12:30"
  afternoon:
    start: "14:30"
    end: "16:45"

# --- Sheet to read ---
worksheet_name: null      # null = first worksheet
ticker_suffix: ".BK"      # appended for yfinance lookup (SET stocks)
