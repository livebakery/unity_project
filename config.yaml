thresholds:
  # discount_pct = (fair - current) / fair * 100
  # alert fires when discount_pct >= value (price <= fair * (1 - pct/100))
  level_1_pct: 0    # price touches fair value
  level_2_pct: 10   # price 10% below fair
  level_3_pct: 15   # price 15% below fair (deep value)

market_hours_ict:
  morning:
    start: "09:55"
    end: "12:30"
  afternoon:
    start: "14:30"
    end: "16:45"

header_keywords:
  ticker:
    - ticker
    - symbol
    - หุ้น
    - ชื่อย่อ
    - code
  fair_value:
    - fair
    - target
    - มูลค่า
    - ประเมิน
    - intrinsic

# Sheet tab name to read; null = first worksheet
worksheet_name: null

# Ticker suffix appended for SET market price lookup via yfinance
ticker_suffix: ".BK"
