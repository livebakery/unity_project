# --- Stocks to monitor (start with one, add tickers freely) ---
watchlist:
  - DOHOME

# --- Buy-signal threshold ---
# ratio = | Up/Down 3Y [Premium] | / | Up/Down [Core] |
# Computed live with current market price (yfinance) and the sheet's
# Fair Price [Premium], 3Y CAGR [Premium], Fair Price [Core].
ratio_threshold: 10.0

# --- Market hours (ICT, UTC+7). Outside these times main.py exits early. ---
market_hours_ict:
  morning:
    start: "09:55"
    end: "12:30"
  afternoon:
    start: "14:30"
    end: "16:45"

# --- Sheet to read ---
worksheet_name: null      # null = first worksheet
ticker_suffix: ".BK"      # appended for yfinance lookup (SET stocks)
