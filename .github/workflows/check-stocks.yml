name: Check Stocks
# VI valuation watcher — alerts Telegram when ratio>=10.

on:
  schedule:
    # SET market hours ICT (UTC+7): 09:55-12:30 morning, 14:30-16:45 afternoon.
    # In UTC that is 02:55-05:30 and 07:30-09:45.
    # Cron uses a loose superset; main.py gates on actual market hours.
    - cron: '*/15 2-9 * * 1-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even if market is closed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-stocks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN: ${{ inputs.force_run && '1' || '' }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name  "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          if [ -f state.json ] && ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "chore: update state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
