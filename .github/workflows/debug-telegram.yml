name: Debug Telegram

# Diagnostic-only workflow. Calls Telegram getMe + getChat + sendMessage with
# the configured TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets and writes the
# (non-secret) results back into the repo at debug/telegram.json. Triggered on
# any push that touches debug/trigger.txt — bumping that file fires a fresh run.

on:
  push:
    paths:
      - 'debug/trigger.txt'
      - '.github/workflows/debug-telegram.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-telegram
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKER: "debug-${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          set +e
          mkdir -p debug

          curl -sS --max-time 10 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" \
            > debug/_getme.json

          curl -sS --max-time 10 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChat?chat_id=${TELEGRAM_CHAT_ID}" \
            > debug/_getchat.json

          curl -sS --max-time 10 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔧 ${MARKER}" \
            > debug/_send.json

          python3 - <<'PY'
          import json, os, datetime

          def read(p):
              try:
                  with open(p) as f:
                      txt = f.read()
                  try:
                      return json.loads(txt)
                  except Exception:
                      return {"raw": txt[:500]}
              except FileNotFoundError:
                  return {"raw": "<missing>"}

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          out = {
              "timestamp_utc": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "marker": os.environ["MARKER"],
              "secrets_meta": {
                  "token_tail6": token[-6:],
                  "token_length": len(token),
                  "token_has_colon": ":" in token,
                  "chat_id_value": chat_id,
                  "chat_id_length": len(chat_id),
              },
              "getMe": read("debug/_getme.json"),
              "getChat": read("debug/_getchat.json"),
              "sendMessage": read("debug/_send.json"),
          }

          with open("debug/telegram.json", "w") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(json.dumps(out, indent=2, ensure_ascii=False))
          PY

          rm -f debug/_getme.json debug/_getchat.json debug/_send.json

      - name: Commit results
        run: |
          git config user.name  "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add debug/telegram.json
          if ! git diff --cached --quiet; then
            git commit -m "debug: telegram probe result [skip ci]"
            git push
          else
            echo "No change to commit."
          fi
