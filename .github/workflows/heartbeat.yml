name: Daily Heartbeat
# Sends an end-of-day Telegram summary at 16:50 ICT on weekdays so the user
# has daily proof-of-life. Skips state mutation; pure read + send.

on:
  schedule:
    # GitHub Actions cron is best-effort and drops runs under load. Schedule
    # three near-identical times Mon-Fri; main.py dedups via last_heartbeat_date.
    - cron: '50 9 * * 1-5'   # 16:50 ICT primary
    - cron: '5 10 * * 1-5'   # 17:05 ICT backup
    - cron: '20 10 * * 1-5'  # 17:20 ICT backup
  workflow_dispatch:

permissions:
  contents: write  # commits state.json (last_heartbeat_date) to persist dedup

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run heartbeat
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEARTBEAT_ONLY: '1'
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name  "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          if [ -f state.json ] && ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "chore: heartbeat date [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=⚠️ *heartbeat ล้มเหลว* — [ดู log](${RUN_URL})"
